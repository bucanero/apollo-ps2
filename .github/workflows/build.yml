name: PS2 Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  psp:
    name: Build (PS2)
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev@sha256:96d40a532972fd84f41fd418ef2b51a5dffd444f0bbb4df2fcf4c55ce0af32df

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk update
          apk add gmp mpc1 mpfr4 make cmake git
          git clone https://github.com/bucanero/dbglogger
          git clone --branch dc-ps2 https://github.com/bucanero/apollo-lib
          git clone https://github.com/bucanero/oosdk_libraries

      - name: build dbglogger
        run: |
          cd dbglogger
          make -f Makefile.ps2 install

      - name: build polarssl
        run: |
          cd oosdk_libraries/polarssl-1.3.9
          cmake --toolchain $PS2DEV/ps2sdk/ps2dev.cmake . -DCMAKE_BUILD_TYPE=Release
          make polarssl
          cp library/libpolarssl.a $PS2DEV/ps2sdk/ports/lib
          cp -R include/polarssl $PS2DEV/ps2sdk/ports/include/polarssl

      - name: build apollo lib
        run: |
          cd apollo-lib
          make -f Makefile.ps2 install

      - name: Configure project
        run: |
          cmake -S . \
                -DCMAKE_TOOLCHAIN_FILE=$PS2DEV/ps2sdk/ps2dev.cmake \
                -D CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \

      - name: Build project
        run: make

      - name: Compress binary
        run: |
          ps2-packer apollo-ps2.elf APOLLO.ELF
          echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: apollo-ps2-build_${{ env.sha_name }}
          path: APOLLO.ELF
          if-no-files-found: error

      # Disc image with the offline saves database and save patches. Only on
      # tags and manual runs: it pulls ~400 MB of saves.
      - name: Build disc image
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          apk add xorriso
          git clone --depth 1 --filter=blob:none --sparse https://github.com/bucanero/apollo-saves
          git -C apollo-saves sparse-checkout set PS1 PS2
          git clone --depth 1 --filter=blob:none --sparse https://github.com/bucanero/apollo-patches
          git -C apollo-patches sparse-checkout set PS1 PS2
          sh tools/make_iso.sh APOLLO.ELF apollo-saves apollo-patches apollo-ps2.iso

      - name: Upload disc image
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: apollo-ps2-iso_${{ env.sha_name }}
          path: apollo-ps2.iso
          if-no-files-found: error
