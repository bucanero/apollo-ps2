name: PS2 Build

on: [push, pull_request]

env:
  BUILD_TYPE: Release

jobs:
  psp:
    name: Build (PS2)
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev@sha256:96d40a532972fd84f41fd418ef2b51a5dffd444f0bbb4df2fcf4c55ce0af32df

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk update
          apk add gmp mpc1 mpfr4 make cmake git
          git clone https://github.com/bucanero/dbglogger
          git clone --branch v1.4.0 https://github.com/bucanero/apollo-lib
          git clone https://github.com/bucanero/oosdk_libraries

      # SDL 2.24.1 (the image's version) rebuilt with the PS2 GS mode hints
      # backported from the SDL2 branch, so Apollo can pick NTSC/PAL (#38)
      - name: build SDL2 (PS2 GS mode hints)
        run: |
          git clone --depth 1 --branch release-2.24.1 https://github.com/libsdl-org/SDL.git sdl2
          cd sdl2
          git apply ../patches/sdl2-2.24.1-ps2-gs-hints.patch
          CFLAGS="-I$PS2DEV/gsKit/include -I$PS2SDK/ports/include" cmake -S . -B build -Wno-dev \
                -DCMAKE_TOOLCHAIN_FILE=$PS2DEV/ps2sdk/ps2dev.cmake \
                -DCMAKE_INSTALL_PREFIX=$PS2SDK/ports \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_POSITION_INDEPENDENT_CODE=OFF \
                -DSDL_TESTS=OFF
          make -C build install

      - name: build dbglogger
        run: |
          cd dbglogger
          make -f Makefile.ps2 install

      - name: build polarssl
        run: |
          cd oosdk_libraries/polarssl-1.3.9
          cmake --toolchain $PS2DEV/ps2sdk/ps2dev.cmake . -DCMAKE_BUILD_TYPE=Release
          make polarssl
          cp library/libpolarssl.a $PS2DEV/ps2sdk/ports/lib
          cp -R include/polarssl $PS2DEV/ps2sdk/ports/include/polarssl

      - name: build apollo lib
        run: |
          cd apollo-lib
          make -f Makefile.ps2 install

      - name: Configure project
        run: |
          cmake -S . \
                -DCMAKE_TOOLCHAIN_FILE=$PS2DEV/ps2sdk/ps2dev.cmake \
                -D CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \

      - name: Build project
        run: make

      - name: Compress binary
        run: |
          ps2-packer apollo-ps2.elf APOLLO.ELF
          echo "sha_name=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: apollo-ps2-build_${{ env.sha_name }}
          path: APOLLO.ELF
          if-no-files-found: error
